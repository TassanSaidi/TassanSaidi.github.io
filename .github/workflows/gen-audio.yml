name: Generate post audio

on:
  push:
    branches: [main]
    paths:
      - "content/posts/**.md"

jobs:
  gen-audio:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # needed so git diff HEAD~1 works

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Kokoro model files
        uses: actions/cache@v4
        with:
          path: .kokoro
          key: kokoro-model-v1.0

      - name: Download Kokoro model (if not cached)
        run: |
          mkdir -p .kokoro
          if [ ! -f .kokoro/kokoro-v1.0.onnx ]; then
            echo "Downloading kokoro-v1.0.onnx (~330 MB)..."
            curl -fL -o .kokoro/kokoro-v1.0.onnx \
              https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          fi
          if [ ! -f .kokoro/voices-v1.0.bin ]; then
            echo "Downloading voices-v1.0.bin..."
            curl -fL -o .kokoro/voices-v1.0.bin \
              https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          fi

      - name: Install system dependencies
        run: sudo apt-get install -y espeak-ng ffmpeg

      - name: Install Python dependencies
        run: pip install kokoro-onnx soundfile

      - name: Generate audio for changed posts
        run: python scripts/gen_audio.py --changed
        env:
          KOKORO_MODEL_DIR: .kokoro

      - name: Commit generated audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/audio/posts/
          git diff --staged --quiet && echo "No new audio files." || \
            git commit -m "Add generated audio for updated posts [skip ci]" && git push
