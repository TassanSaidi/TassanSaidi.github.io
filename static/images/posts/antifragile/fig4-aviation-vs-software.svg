<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 258" width="100%" font-family="Georgia, serif">
  <defs>
    <marker id="a" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6Z" fill="#9ca3af"/>
    </marker>
    <marker id="b" markerWidth="6" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M6,0 L0,3 L6,6Z" fill="#9ca3af"/>
    </marker>
  </defs>
  <text x="350" y="18" text-anchor="middle" font-size="13" fill="#111827" font-style="italic">Aviation closes the loop; we stop at the patch</text>
  <!-- Row labels -->
  <text x="5" y="93" font-size="11" fill="#374151" font-weight="bold">Aviation</text>
  <text x="5" y="213" font-size="11" fill="#374151" font-weight="bold">Software</text>
  <text x="5" y="225" font-size="11" fill="#374151">today</text>
  <!-- AVIATION ROW (y=54 to y=122, center y=88) -->
  <!-- Box 1: Incident -->
  <rect x="90" y="54" width="135" height="68" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="157" y="80" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">Incident</text>
  <text x="157" y="96" text-anchor="middle" font-size="10" fill="#6b7280">or near-miss</text>
  <!-- Arrow -->
  <line x1="225" y1="88" x2="240" y2="88" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- Box 2: Black box (blue) -->
  <rect x="243" y="54" width="135" height="68" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="310" y="80" text-anchor="middle" font-size="11" fill="#1d4ed8" font-weight="bold">Black box</text>
  <text x="310" y="94" text-anchor="middle" font-size="10" fill="#1d4ed8">recovered,</text>
  <text x="310" y="108" text-anchor="middle" font-size="10" fill="#1d4ed8">data analysed</text>
  <!-- Arrow -->
  <line x1="378" y1="88" x2="393" y2="88" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- Box 3: Investigation -->
  <rect x="396" y="54" width="135" height="68" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="463" y="80" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">Investigation</text>
  <text x="463" y="96" text-anchor="middle" font-size="10" fill="#6b7280">cause identified,</text>
  <text x="463" y="110" text-anchor="middle" font-size="10" fill="#6b7280">simulated</text>
  <!-- Arrow -->
  <line x1="531" y1="88" x2="546" y2="88" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- Box 4: Changes applied -->
  <rect x="549" y="54" width="143" height="68" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="620" y="80" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">Changes applied</text>
  <text x="620" y="96" text-anchor="middle" font-size="10" fill="#6b7280">aircraft, procedures,</text>
  <text x="620" y="110" text-anchor="middle" font-size="10" fill="#6b7280">training updated</text>
  <!-- Feedback arc for Aviation -->
  <path d="M 692,54 Q 391,36 90,54" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#b)"/>
  <text x="391" y="34" text-anchor="middle" font-size="10" fill="#6b7280" font-style="italic">the next flight is safer</text>
  <polygon points="86,48 94,48 90,56" fill="#9ca3af"/>
  <!-- SOFTWARE ROW (y=174 to y=242, center y=208) -->
  <!-- Box 1: Vulnerability -->
  <rect x="90" y="174" width="135" height="68" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="157" y="200" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">Vulnerability</text>
  <text x="157" y="216" text-anchor="middle" font-size="10" fill="#6b7280">disclosed</text>
  <!-- Arrow -->
  <line x1="225" y1="208" x2="240" y2="208" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- Box 2: Patch -->
  <rect x="243" y="174" width="135" height="68" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="310" y="200" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">Patch applied</text>
  <text x="310" y="216" text-anchor="middle" font-size="10" fill="#6b7280">(often in emergency)</text>
  <!-- Arrow -->
  <line x1="378" y1="208" x2="393" y2="208" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- Box 3: Move on -->
  <rect x="396" y="174" width="135" height="68" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="463" y="200" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">Move on</text>
  <text x="463" y="216" text-anchor="middle" font-size="10" fill="#6b7280">incident treated</text>
  <text x="463" y="230" text-anchor="middle" font-size="10" fill="#6b7280">as over</text>
  <!-- Arrow (dashed) to empty box -->
  <line x1="531" y1="208" x2="546" y2="208" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <!-- Box 4: Nothing recorded (dashed) -->
  <rect x="549" y="174" width="143" height="68" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="620" y="200" text-anchor="middle" font-size="11" fill="#6b7280">Nothing recorded,</text>
  <text x="620" y="216" text-anchor="middle" font-size="10" fill="#6b7280">nothing learnt</text>
</svg>
