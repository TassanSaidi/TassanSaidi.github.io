<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WiFi Heatmap — Sign in</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 2.5rem 2rem;
      width: min(380px, calc(100vw - 2rem));
      box-shadow: 0 20px 40px rgba(0,0,0,.4);
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    p.sub {
      font-size: 0.875rem;
      color: #94a3b8;
      margin-bottom: 1.75rem;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: #94a3b8;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 0.4rem;
    }

    input[type="password"] {
      width: 100%;
      padding: 0.65rem 0.85rem;
      border: 1px solid #475569;
      border-radius: 8px;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="password"]:focus {
      border-color: #6366f1;
    }

    button {
      margin-top: 1.25rem;
      width: 100%;
      padding: 0.7rem;
      border: none;
      border-radius: 8px;
      background: #6366f1;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    button:hover { background: #4f46e5; }
    button:active { background: #4338ca; }

    .error {
      display: none;
      margin-top: 1rem;
      padding: 0.6rem 0.85rem;
      border-radius: 8px;
      background: #450a0a;
      border: 1px solid #991b1b;
      color: #fca5a5;
      font-size: 0.875rem;
    }

    .error.visible { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <h1>WiFi Heatmap</h1>
    <p class="sub">Enter the access password to continue.</p>

    <form method="POST" action="/api/login">
      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        autofocus
        required
        placeholder="••••••••"
      />

      <div class="error" id="err">Incorrect password. Please try again.</div>

      <button type="submit">Sign in</button>
    </form>
  </div>

  <script>
    // Show error banner if redirected back with ?error=1
    if (new URLSearchParams(location.search).get('error') === '1') {
      document.getElementById('err').classList.add('visible');
    }
  </script>
</body>
</html>
